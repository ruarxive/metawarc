[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metawarc"
version = "2.0.3"
description = "Bounded, versioned indexing, extraction, and analysis for WARC collections"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ivan Begtin", email = "ivan@begtin.tech" }]
keywords = ["warc", "web-archive", "metadata", "duckdb", "parquet"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Archiving",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "click>=8.1",
  "duckdb>=1.0",
  "fonttools[woff]>=4.53",
  "hachoir>=3.2",
  "lxml>=5.0",
  "pdfminer.six>=20231228",
  "pyarrow>=16",
  "pytz>=2024.1",
  "rich>=13",
  "warcio>=1.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "pydantic>=2.8", "uvicorn>=0.30"]
mcp = ["fastmcp>=2.0"]
replay = ["fastapi>=0.115", "pydantic>=2.8", "uvicorn>=0.30"]
all = [
  "fastapi>=0.115",
  "fastmcp>=2.0",
  "pydantic>=2.8",
  "uvicorn>=0.30",
]
dev = [
  "build>=1.2",
  # TestClient for the FastAPI/starlette interface. starlette 1.x does
  # `import httpx2 as httpx` internally, so the dev extra must provide
  # httpx2. The >=2.12 pin keeps us off httpx2 2.9.1, which carried six
  # CVEs (PYSEC-2026-3844 through PYSEC-2026-3849).
  "httpx2>=2.12",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.7",
  "types-setuptools",
]

[project.urls]
Homepage = "https://github.com/ruarxive/metawarc"
Documentation = "https://ruarxive.org/metawarc/"
Issues = "https://github.com/ruarxive/metawarc/issues"
Repository = "https://github.com/ruarxive/metawarc.git"

[project.scripts]
metawarc = "metawarc.core:cli"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["metawarc*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = [
  "performance: bounded-memory performance regression tests",
]
filterwarnings = [
  "error",
]

[tool.coverage.run]
branch = true
source = ["metawarc"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B904"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["duckdb.*", "fontTools.*", "hachoir.*", "lxml.*", "pdfminer.*", "pyarrow.*", "warcio.*", "fastmcp.*"]
ignore_missing_imports = true
