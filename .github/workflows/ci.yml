name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[all,dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy metawarc
      - run: pytest --cov=metawarc --cov-report=term-missing --cov-fail-under=75
      - run: pytest tests/test_workspace_index.py tests/test_query_export.py --cov=metawarc.cmds.indexer --cov-fail-under=70

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build pip-audit cyclonedx-bom
      - run: python -m build
      - run: pip-audit
      - run: cyclonedx-py environment --output-file sbom.json
      - name: Install and smoke-test wheel variants
        run: |
          wheel=$(find dist -name 'metawarc-*.whl' -print -quit)
          for extra in core api mcp all; do
            python -m venv "smoke-$extra"
            if [ "$extra" = core ]; then
              "smoke-$extra/bin/pip" install "$wheel"
            else
              "smoke-$extra/bin/pip" install "$wheel[$extra]"
            fi
            "smoke-$extra/bin/metawarc" --version
          done
          smoke-core/bin/python .github/scripts/installed_smoke.py
          smoke-api/bin/python -c 'from metawarc.cmds.server import create_app; assert create_app()'
          smoke-mcp/bin/python -c 'from metawarc.mcp_server import create_mcp; assert create_mcp()'
          smoke-all/bin/python -c 'from metawarc.cmds.server import create_app; from metawarc.mcp_server import create_mcp; assert create_app() and create_mcp()'
      - run: python .github/scripts/write_provenance.py
      - uses: actions/upload-artifact@v7
        with:
          name: distributions-and-sbom
          path: |
            dist/*
            sbom.json
            provenance.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        working-directory: ./docs
        run: npm ci
      - name: Build documentation site
        working-directory: ./docs
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Run the MIT-licensed CLI. gitleaks-action requires GITLEAKS_LICENSE on
      # organization repositories such as ruarxive/metawarc.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "/tmp/${archive}"
          echo "${GITLEAKS_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan for secrets
        run: gitleaks detect --source . --verbose --redact --exit-code 1
