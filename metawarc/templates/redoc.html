<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ title }}</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f7f6fb;
    }

    #redoc-container {
      background-color: #fff;
    }
  </style>
</head>
<body>
  {% include "header.html" %}

  <noscript>
    ReDoc requires Javascript to function. Please enable it to browse the documentation.
  </noscript>

  <div id="redoc-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/redoc@2.4.0/bundles/redoc.standalone.js"></script>
  <script>
    Redoc.init(
      {{ openapi_url | tojson }},
      {
        disableSearch: true,
        theme: {
          colors: { primary: { main: "#4777d7" } },
          typography: {
            fontFamily: "system-ui, -apple-system, sans-serif",
            headings: { fontFamily: "system-ui, -apple-system, sans-serif" },
            code: { fontFamily: "ui-monospace, monospace" },
            links: { color: "#0a58ca" }
          },
          sidebar: { width: "260px", backgroundColor: "#f7f6fb" },
          rightPanel: { backgroundColor: "#222" }
        }
      },
      document.getElementById("redoc-container")
    );
  </script>
</body>
</html>
